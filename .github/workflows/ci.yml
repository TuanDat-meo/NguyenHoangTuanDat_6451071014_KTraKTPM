name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/path"
          -w /path
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --exit-code 1 --log-opts="--all" .

  branch-policy:
    name: Branch and commit policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch flow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash .github/scripts/validate-branch-policy.sh

      - name: Validate commit message policy
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validate-commit-messages.sh

  app-tests:
    name: Java Selenium tests and Allure report
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Gradle tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:test

      - name: Generate Allure report
        if: always()
        run: ./gradlew :app:allureReport --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: app/build/reports/allure-report/allureReport/
          if-no-files-found: warn